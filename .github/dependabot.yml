# Keeps the action versions used by .github/workflows current. Monthly is
# often enough, since these workflows reference a handful of actions and none
# of them moves fast. An outdated action then arrives as a pull request rather
# than as a confusing failure months later.
#
# Only the github-actions ecosystem is enabled. This repository has no other
# manifest Dependabot understands.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # For github-actions, "/" means .github/workflows, not the repository
    # root.
    directory: "/"
    schedule:
      interval: "monthly"
