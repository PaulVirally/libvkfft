# Creates the GitHub release for a pushed tag.
#
# The three Yggdrasil recipes fetch this repository as an ArchiveSource at
# https://github.com/PaulVirally/libvkfft/archive/refs/tags/<tag>.tar.gz.
# GitHub generates that tarball from the tag and serves it whether or not a
# release object exists, so the release adds only the notes.
#
# Binaries ship through VkFFT_OpenCL_jll, VkFFT_CUDA_jll and VkFFT_Metal_jll.
# Do not attach a built library here. It would duplicate the JLL builds
# without their auditing and would drift from them.
#
# This workflow does not wait for CI.yml to pass on the tagged commit.
name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback for a tag pushed before this workflow existed, or whose
  # run failed for a reason unrelated to the tag. Start it from the tag, not
  # from a branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    steps:
      # No checkout and no action reference. The gh CLI is preinstalled on the
      # hosted Ubuntu image and needs a repository name and a token rather
      # than a working tree, and GitHub generates the notes from the tag's
      # history. So there is nothing here for Dependabot to update.
      - name: Create the release for the pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail

          # workflow_dispatch can be started from a branch, where ref_name is a
          # branch name and creating a release from it would be wrong.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::${GITHUB_REF} is not a tag. Run this on a tag."
            exit 1
          fi

          # Re-running the manual fallback on a tag that already has a release
          # should do nothing rather than fail.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "${TAG} already has a release. Leaving it alone."
            exit 0
          fi

          # --verify-tag makes gh refuse a tag that does not exist on the
          # remote instead of creating one
          gh release create "${TAG}" \
            --title "${TAG}" \
            --verify-tag \
            --generate-notes
