# The compile matrix for the wrapper. Its job is to catch a compile break in
# src/vkfft_wrapper.cpp or in the CMake logic
#
# This is compile only, no device involved, so a green run says the code builds
# and links and nothing more:
#   - the CUDA job (backend 1). It links libcuda, libnvrtc and libcudart and
#     compiles no device code, since VkFFT emits CUDA source and hands it to
#     nvrtc at runtime, so a runner with no GPU builds it fine and can never
#     run it.
#   - the Metal job (backend 5). Its quick_test_metal executable is built and
#     deliberately never run, because whether a hosted macOS arm64 runner
#     exposes a usable Metal device is an open question and not one this
#     workflow should answer by accident.
#
# Actually executes transforms:
#   - the two OpenCL jobs (backend 3), because pocl gives a CPU OpenCL device
#     that needs no GPU hardware at all. The quick_test there runs c2c, r2c,
#     fused convolution and a plan save and reload against a reference DFT.
#     This is the only place in the matrix where a number is checked.
#
# So a green matrix is not evidence that the CUDA or the Metal transforms work.
# The gates for those stay the manual test/cuda run and the local Metal suite in
# VkFFT.jl.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to a branch makes the first run's answer uninteresting.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  opencl:
    name: OpenCL backend 3, ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      # One compiler failing says nothing about the other, and knowing both
      # answers in one run beats bisecting across two.
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      # VkFFT is a pinned submodule at lib/VkFFT and CMakeLists.txt fails
      # outright when lib/VkFFT/vkFFT/vkFFT.h is missing, so the checkout has
      # to bring it. VkFFT itself declares no submodules today, and recursive
      # costs nothing if that ever changes.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # opencl-headers supplies CL/cl.h, ocl-icd-opencl-dev supplies the
      # libOpenCL.so that find_package(OpenCL) links against, and
      # pocl-opencl-icd supplies the CPU device that makes quick_test runnable.
      # clinfo is here so a device problem is visible in the log rather than
      # inferred from a failing test.
      - name: Install the OpenCL headers, an ICD loader and pocl
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            opencl-headers ocl-icd-opencl-dev pocl-opencl-icd clinfo

      - name: List the OpenCL devices
        run: |
          set -o pipefail
          clinfo -l

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVKFFT_BACKEND=3 \
            -DVKFFT_WRAPPER_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel

      # The one step in this workflow that computes a transform and checks the
      # result. It runs on pocl's CPU device.
      - name: Run quick_test on the pocl device
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure

  cuda:
    name: CUDA backend 1, compile only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The toolkit comes from a pinned action rather than from apt, because
      # the distribution packages lag and the version actually used matters for
      # the headers the wrapper compiles against. method local runs the NVIDIA
      # runfile with --toolkit, so no driver is installed and no reboot is
      # needed, which is what makes this work on a runner with no GPU.
      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "12.6.3"
          method: local
          linux-local-args: '["--toolkit"]'
          log-file-suffix: "ubuntu-24.04.txt"

      - name: Report the installed toolkit
        run: |
          set -o pipefail
          echo "CUDA_PATH is ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          nvcc --version

      # find_package(CUDAToolkit) needs nvcc on PATH, which the action puts
      # there. The fallback path in CMakeLists.txt, the one Yggdrasil takes,
      # is not what runs here.
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKFFT_BACKEND=1

      # There is no test target for backend 1 in CMakeLists.txt, and there
      # could not be a useful one without a device. This job ends at the link.
      #
      # Nothing built here is uploaded, and nothing built here should be. The
      # backend 1 build bakes CUDA_TOOLKIT_ROOT_DIR into the fp16 kernels it
      # will generate, and the path it bakes is this runner's.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel

  metal:
    name: Metal backend 5, compile only
    runs-on: macos-15
    steps:
      # metal-cpp ships inside the VkFFT checkout at lib/VkFFT/metal-cpp and
      # CMakeLists.txt checks for it by hand, so this job needs the submodule
      # for two separate reasons.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Report the toolchain
        run: |
          set -o pipefail
          uname -m
          xcodebuild -version
          cmake --version

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKFFT_BACKEND=5

      # This builds vkfft_quick_test_metal as well, which is a compile check on
      # the Metal example code. It is not run.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel
