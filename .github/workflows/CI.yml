# Compile matrix for the wrapper. It catches build breaks in
# src/vkfft_wrapper.cpp and in the CMake logic.
#
# The CUDA (backend 1) and Metal (backend 5) jobs compile and link only. VkFFT
# emits CUDA source and hands it to nvrtc at runtime, so backend 1 builds on a
# runner with no GPU. The Metal executable is built but not run, because a
# hosted macOS runner is not guaranteed to expose a usable Metal device.
#
# The OpenCL jobs (backend 3) run transforms on pocl's CPU device, which needs
# no GPU hardware. quick_test there covers c2c, r2c, fused convolution and a
# plan save and reload against a reference DFT. It is the only job in the
# matrix that checks a numeric result, so a green matrix says nothing about the
# CUDA or Metal transforms. Those are checked by hand with the VkFFT.jl
# test/cuda run and the local Metal suite.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels an in-flight run on the same ref, except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  opencl:
    name: OpenCL backend 3, ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      # Report both compilers in one run instead of stopping at the first
      # failure.
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      # CMakeLists.txt fails when lib/VkFFT/vkFFT/vkFFT.h is missing, so the
      # checkout has to bring the pinned submodule.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # opencl-headers supplies CL/cl.h, ocl-icd-opencl-dev the libOpenCL.so
      # that find_package(OpenCL) links against, and pocl-opencl-icd the CPU
      # device that makes quick_test runnable. clinfo makes a missing device
      # visible in the log.
      - name: Install the OpenCL headers, an ICD loader and pocl
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            opencl-headers ocl-icd-opencl-dev pocl-opencl-icd clinfo

      - name: List the OpenCL devices
        run: |
          set -o pipefail
          clinfo -l

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVKFFT_BACKEND=3 \
            -DVKFFT_WRAPPER_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel

      # The only step in this workflow that computes a transform and checks
      # the result. It runs on pocl's CPU device.
      - name: Run quick_test on the pocl device
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure

  cuda:
    name: CUDA backend 1, compile only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # A pinned action rather than apt, because the distribution packages lag
      # and the toolkit version fixes the headers the wrapper compiles
      # against. method local runs the NVIDIA runfile with --toolkit, which
      # installs no driver and needs no reboot.
      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: "12.6.3"
          method: local
          linux-local-args: '["--toolkit"]'
          log-file-suffix: "ubuntu-24.04.txt"

      - name: Report the installed toolkit
        run: |
          set -o pipefail
          echo "CUDA_PATH is ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          nvcc --version

      # find_package(CUDAToolkit) needs nvcc on PATH, which the action
      # provides. The CMakeLists.txt fallback that Yggdrasil takes is not
      # exercised here.
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKFFT_BACKEND=1

      # CMakeLists.txt defines no test target for backend 1, so this job ends
      # at the link. Do not upload what it builds. The backend 1 build bakes
      # this runner's CUDA_TOOLKIT_ROOT_DIR into the fp16 kernels it
      # generates.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel

  metal:
    name: Metal backend 5, compile only
    runs-on: macos-15
    steps:
      # metal-cpp ships inside the VkFFT checkout at lib/VkFFT/metal-cpp, and
      # CMakeLists.txt checks for it before configuring.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Report the toolchain
        run: |
          set -o pipefail
          uname -m
          xcodebuild -version
          cmake --version

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVKFFT_BACKEND=5

      # This also builds vkfft_quick_test_metal, a compile check on the Metal
      # example code. It is not run.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel
